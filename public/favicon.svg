<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#e000d0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0b0f19" stroke="#1f293d" stroke-width="2" />
  <rect x="6" y="6" width="116" height="116" rx="22" fill="none" stroke="url(#brand-grad)" stroke-width="1.5" opacity="0.3" />
  <text 
    x="64" 
    y="88" 
    font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" 
    font-size="64" 
    font-weight="900" 
    fill="url(#brand-grad)" 
    text-anchor="middle"
    letter-spacing="-3"
    filter="url(#glow)"
  >OA</text>
</svg>
